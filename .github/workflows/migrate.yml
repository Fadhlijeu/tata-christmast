name: Migrate Christmas site and deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: Fadhlijeu/Someone-is-My-Something
          ref: main
          path: source

      - name: Copy complete project and commit it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rsync -a --delete --exclude='.git/' source/ site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Migrate Christmas tree site from Someone-is-My-Something"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
